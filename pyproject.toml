[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threadtrace"
version = "0.1.0"
description = "A tiny provenance trail for evolving claims."
requires-python = ">=3.10"

[project.scripts]
threadtrace = "threadtrace:main"

[tool.setuptools]
py-modules = ["threadtrace"]
